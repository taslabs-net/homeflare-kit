# Secret scanning, on its own schedule and its own check.
#
# ★ SEPARATE FROM ci.yml BY CONCERN. A secret scan answers a different question from "is
#   this code correct", it runs on a schedule as well as on PRs (a rule added tomorrow
#   can find a secret committed today), and it needs full history, which the CI jobs
#   deliberately do not fetch.
name: security

on:
  # ⛔ NO `push: branches: [main]`, for the reason ci.yml gives: main only moves by squashing
  #   a PR this same workflow already scanned, so the post-merge scan re-read commits it had
  #   just cleared. The weekly cron below is what covers "a rule added tomorrow finds a
  #   secret committed today" — and it is the one that fetches full history.
  pull_request:
  schedule:
    # ⚠️ Off the hour deliberately — :00 is when every scheduled workflow on GitHub fires
    #   at once, and queue time is the result.
    - cron: '37 6 * * 1'

permissions:
  contents: read

# ★ WAS MISSING HERE WHILE ci.yml HAD IT. Without a group, a superseded scan ran to
#   completion instead of being cancelled: 0 of 13 security.yml files had this key, and over
#   7 days 8 scans finished against a commit that was no longer the branch tip, each holding
#   one of the mini's 3 slots for a result nobody would read.
# ⛔ cancel-in-progress IS CONDITIONAL, NOT `true`. The scheduled run's ref is
#   refs/heads/main; a plain `true` here would let anything sharing that group kill the
#   weekly full-history scan. Only pull-request runs are ever cancelled.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ⛔ FULL HISTORY. A shallow clone scans only the tip, which misses the case
          #   that matters most: a secret added and then removed in a later commit. It is
          #   still in the history, still fetchable, and still compromised.
          fetch-depth: 0

      # The vendor's own action, so the binary and its rules stay in step.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
