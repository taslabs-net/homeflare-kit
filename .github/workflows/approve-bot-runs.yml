# Approve the release bot's own workflow runs.
#
# ⚠️ THE PROBLEM THIS SOLVES, MEASURED 2026-09-15. Every run on the changesets
#   "Version Packages" branch parks at `action_required`. GitHub's approval policy is
#   written for pull requests from FORKS, but it reaches `github-actions[bot]` on a
#   same-repo branch too: the bot has no merged contribution history, so it reads as a
#   first-time contributor. With `ci` and `secret scan` required, the release PR blocks
#   itself forever and a human has to click Approve on every single release.
#
# ⛔ THE TRUST BOUNDARY IS NARROW, AND DELIBERATELY SO. This approves a run only when ALL
#   of these hold:
#     - the run was triggered by github-actions[bot]
#     - its branch is exactly `changeset-release/main`, which only the release workflow
#       ever creates and which branch protection stops anyone else from pushing to
#     - the run is actually parked at `action_required`
#   ★ A branch named anything else, or a run from any other actor, is ignored. This is
#     not "approve everything automatically" — a first-time human contributor's fork PR
#     still waits for a person, which is what that policy is for.
name: approve-bot-runs

on:
  workflow_run:
    workflows: [ci, security]
    types: [completed]

permissions:
  actions: write # approve a parked run

jobs:
  approve:
    if: >-
      github.event.workflow_run.conclusion == 'action_required' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      github.event.workflow_run.head_branch == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Approve the parked run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Approving run $RUN_ID on changeset-release/main"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve"
          {
            echo "### Release run approved"
            echo
            echo "Run \`$RUN_ID\` on \`changeset-release/main\` was parked at"
            echo "\`action_required\` and has been approved automatically."
          } >> "$GITHUB_STEP_SUMMARY"
