name: Bug report
description: Something in a published package does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The two dropdowns below save a round-trip — a defect in
        `@homeflare/ui` under React 19 and one in `@homeflare/kit` on workerd have
        almost nothing in common.

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@homeflare/kit'
        - '@homeflare/cloudflare'
        - '@homeflare/ui'
        - '@homeflare/config'
        - not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: From your lockfile, not your package.json range.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Where the failure happens, not where you develop.
      options:
        - Cloudflare Workers (workerd)
        - Node
        - Bun
        - Browser
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      description: If an error was thrown, paste it in full — the stack usually names the layer.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: |
        The smallest code that shows it. A failing test against the built package is
        ideal — see `bun run smoke` for the shape.
      render: typescript
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest published version of that package.
          required: true
        - label: This is a defect, not a missing feature.
          required: true
