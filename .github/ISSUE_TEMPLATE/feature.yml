name: Feature proposal
description: Something these packages should do and do not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ⛔ **The house rule this repo is built on: prefer a known SDK over hand-rolling.**
        If an established library already does this well, the proposal is usually "adopt
        X", not "write our own". Say so below and it will be taken seriously — that is
        the preferred answer, not a rejection.

  - type: dropdown
    id: package
    attributes:
      label: Which package should own this?
      options:
        - '@homeflare/kit — runtime-neutral, zero-dependency core'
        - '@homeflare/cloudflare — Workers-specific (workerd, bindings, Access)'
        - '@homeflare/ui — React components on Cloudflare Kumo'
        - '@homeflare/config — shared tsconfig / oxlint / oxfmt'
        - a new package
        - not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: |
        What are you writing by hand today, and in how many repos? The case for a shared
        package is repetition — one caller is a helper in that caller.
    validations:
      required: true

  - type: textarea
    id: existing
    attributes:
      label: Does an SDK already do this?
      description: |
        Name it and link it, with its weight — dependency count, bundle size, and whether
        it works on workerd. "Nothing suitable exists" is a valid answer, but it is a
        finding, so say what you looked at.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Proposed API
      description: The call site as you would want to write it.
      render: typescript

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this must respect
      options:
        - label: '`@homeflare/kit` stays runtime-neutral — no `bun:*`, no `node:*`, no filesystem.'
        - label: Anything runtime-specific belongs in `@homeflare/cloudflare` or its own subpath.
        - label: New runtime dependencies are a cost every consumer pays; I have said why this one earns it.
